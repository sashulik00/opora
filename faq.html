<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Частые вопросы — Опора. Школа ухода</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="faq" class="ref-page soft-page">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="ref-banner">
      <div class="soft-container ref-banner-in">
        <div class="soft-intro">
          <h1>Частые вопросы</h1>
          <p class="lead">Нажмите на вопрос, чтобы увидеть ответ</p>
        </div>
        <!-- Вкладки разделов строит js/main.js -->
        <nav class="ref-tabs" id="reference-tabs" aria-label="Разделы справочника"></nav>
      </div>
    </section>

    <section class="block ref-content">
      <div class="soft-container">
        <!-- Фильтр по разделам и вопросы заполняются из js/main.js по данным из js/data.js -->
        <div class="card ref-filters">
          <div class="ref-filter-row">
            <p class="filters-label">Раздел</p>
            <div id="faq-filters" class="filters" role="group" aria-label="Раздел"></div>
          </div>
        </div>
        <div id="faq-list"></div>

        <p class="card faq-more">
          Не нашли ответ? <a href="consultant.html">Спросите консультанта</a>
        </p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <!-- Вход и прогресс: сервер или память браузера (до main.js) -->
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
