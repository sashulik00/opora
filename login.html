<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Опора. Школа ухода</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="block">
      <div class="container narrow" id="auth">

        <!-- Показывается, если пользователь НЕ вошёл -->
        <div id="auth-forms" class="card">
          <h1>Кабинет</h1>

          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="login" role="tab" aria-selected="true">Вход</button>
            <button class="tab" data-tab="register" role="tab" aria-selected="false">Регистрация</button>
          </div>

          <form id="login-form">
            <label for="login-email">Электронная почта</label>
            <input type="email" id="login-email" required autocomplete="email">
            <p id="login-error" class="error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-full">Войти</button>
          </form>

          <form id="register-form" hidden>
            <label for="reg-name">Ваше имя</label>
            <input type="text" id="reg-name" required autocomplete="given-name">
            <label for="reg-email">Электронная почта</label>
            <input type="email" id="reg-email" required autocomplete="email">
            <p id="register-error" class="error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
          </form>

          <p class="muted small">Данные хранятся только в этом браузере на вашем устройстве.</p>
        </div>

        <!-- Показывается, если пользователь вошёл -->
        <div id="auth-logged" class="card" hidden>
          <h1>Здравствуйте, <span id="logged-name"></span>!</h1>
          <p>Вы вошли как <strong id="logged-email"></strong>.</p>
          <div class="buttons">
            <a href="index.html" class="btn btn-primary">На главную</a>
            <button id="logout-btn" class="btn btn-secondary">Выйти</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
