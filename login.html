<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Опора. Школа ухода</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="block">
      <div class="container narrow" id="auth">

        <!-- Показывается, если пользователь НЕ вошёл -->
        <div id="auth-forms" class="card">
          <h1>Кабинет</h1>

          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="login" role="tab" aria-selected="true">Войти</button>
            <button class="tab" data-tab="register" role="tab" aria-selected="false">Зарегистрироваться</button>
          </div>

          <form id="login-form">
            <label for="login-email">Электронная почта</label>
            <input type="email" id="login-email" required autocomplete="email">
            <label for="login-password">Пароль</label>
            <input type="password" id="login-password" required autocomplete="current-password">
            <p id="login-error" class="error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-full">Войти</button>
          </form>

          <form id="register-form" hidden>
            <label for="reg-email">Электронная почта</label>
            <input type="email" id="reg-email" required autocomplete="email">
            <label for="reg-password">Пароль (не короче 8 символов)</label>
            <input type="password" id="reg-password" required minlength="8" autocomplete="new-password">
            <label for="reg-password2">Повторите пароль</label>
            <input type="password" id="reg-password2" required minlength="8" autocomplete="new-password">
            <p id="register-error" class="error" role="alert"></p>
            <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
          </form>

          <!-- Текст подставляет js/main.js: где хранятся данные (на сервере или в этом браузере) -->
          <p class="muted small" id="auth-note"></p>
        </div>

        <!-- Показывается, если пользователь вошёл -->
        <div id="auth-logged" class="card" hidden>
          <h1>Здравствуйте!</h1>
          <p>Вы вошли как <strong id="logged-email"></strong>.</p>
          <div class="buttons">
            <a href="cabinet.html" class="btn btn-primary">В личный кабинет</a>
            <button id="logout-btn" class="btn btn-secondary">Выйти</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <!-- Вход и прогресс: сервер или память браузера (до main.js) -->
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
