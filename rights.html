<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Права и документы — Опора. Школа ухода</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="rights" class="ref-page soft-page">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="ref-banner">
      <div class="soft-container ref-banner-in">
        <div class="soft-intro">
          <h1>Права и документы</h1>
          <p class="lead">Выплаты, инвалидность, протезы и льготы: что положено и куда обратиться</p>
        </div>
        <form class="ref-search" role="search">
          <label for="rights-search" class="visually-hidden">Поиск по ситуациям</label>
          <input type="search" id="rights-search" placeholder="Например: инвалидность, протез, выплаты" autocomplete="off">
          <button type="submit" class="ref-search-btn">Найти</button>
        </form>
        <!-- Вкладки разделов строит js/main.js -->
        <nav class="ref-tabs" id="reference-tabs" aria-label="Разделы справочника"></nav>
      </div>
    </section>

    <section class="block ref-content">
      <div class="soft-container">
        <p class="rights-note">Информация справочная; проверяйте актуальность на официальных сайтах.</p>

        <!-- Карточки-ситуации строятся из js/main.js по массиву RIGHTS в js/data.js -->
        <div id="rights-list" class="rights-list"></div>

        <!-- Словарь из GLOSSARY в js/data.js, телефон из js/phones.js -->
        <section class="glossary" aria-labelledby="glossary-title">
          <h2 id="glossary-title">Словарь сокращений</h2>
          <dl class="glossary-list" id="glossary-list"></dl>
        </section>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/phones.js"></script>
  <!-- Вход и прогресс: сервер или память браузера (до main.js) -->
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
