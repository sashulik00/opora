<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справочник — Опора. Школа ухода</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reference" class="ref-page soft-page">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="ref-banner">
      <div class="soft-container ref-banner-in">
        <div class="soft-intro">
          <h1>Справочник</h1>
          <p class="lead">Найдите нужную тему без прохождения курса</p>
        </div>
        <form class="ref-search" role="search">
          <label for="search-input" class="visually-hidden">Поиск по темам</label>
          <input type="search" id="search-input" placeholder="Например: ожог, пролежни, выплаты" autocomplete="off">
          <button type="submit" class="ref-search-btn">Найти</button>
        </form>
        <!-- Вкладки разделов строит js/main.js -->
        <nav class="ref-tabs" id="reference-tabs" aria-label="Разделы справочника"></nav>
      </div>
    </section>

    <section class="block ref-content">
      <div class="soft-container" id="reference-page">
        <!-- Кнопки-фильтры создаются из js/main.js -->
        <div class="card ref-filters">
          <div class="ref-filter-row">
            <p class="filters-label">Что показать</p>
            <div id="type-filters" class="filters" role="group" aria-label="Тип материала"></div>
          </div>
          <div class="ref-filter-row">
            <p class="filters-label">Раздел</p>
            <div id="filters" class="filters" role="group" aria-label="Раздел"></div>
          </div>
          <p id="results-count" class="ref-count" aria-live="polite"></p>
        </div>

        <!-- Карточки тем заполняются из js/main.js по данным из js/data.js -->
        <div id="reference-list" class="tile-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <!-- Вход и прогресс: сервер или память браузера (до main.js) -->
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
