<!DOCTYPE html>
<html lang="ru">
<head>

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="ref-banner ref-banner--article">

        <div class="soft-intro" id="article-head"></div>

    <section class="block ref-content">
      <!-- Статья строится из js/main.js: тема берётся из адреса (article.html?id=burns) -->
      <div class="container" id="article-page"></div>
    </section>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <!-- Вход и прогресс: сервер или память браузера (до main.js) -->
