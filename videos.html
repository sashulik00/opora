<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видео — Опора. Школа ухода</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="videos" class="ref-page soft-page">

  <header id="site-header" class="site-header"></header>

  <main>
    <section class="ref-banner">
      <div class="soft-container ref-banner-in">
        <div class="soft-intro">
          <h1>Видео</h1>
          <p class="lead">Ролики из уроков и справочника. Нажмите на карточку, и ролик откроется в окне</p>
        </div>
        <!-- Вкладки разделов строит js/main.js -->
        <nav class="ref-tabs" id="reference-tabs" aria-label="Разделы справочника"></nav>
      </div>
    </section>

    <section class="block ref-content">
      <div class="soft-container">
        <!-- Карточки заполняются из js/main.js по данным из js/data.js -->
        <div id="videos-list"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <!-- Вход и прогресс: сервер или память браузера (до main.js) -->
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
